<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <!-- زمینه پس‌زمینه گرد -->
  <rect width="100" height="100" rx="22" fill="#0F172A" />

  <!-- شکل هندسی خورشید و پنل -->
  <g transform="translate(10, 10)">
    <!-- لایه اول: خورشید در حال طلوع -->
    <circle cx="40" cy="40" r="16" fill="url(#iconGradient)" />

    <!-- لایه دوم: شبکه پنل خورشیدی -->
    <path d="M 15,55 L 65,55 L 58,70 L 22,70 Z" fill="url(#iconGradient)" opacity="0.9" />
    
    <!-- خطوط تفکیک پنل -->
    <line x1="40" y1="55" x2="40" y2="70" stroke="#0F172A" stroke-width="2" />
    <line x1="26" y1="62.5" x2="54" y2="62.5" stroke="#0F172A" stroke-width="1.5" />

    <!-- پرتوهای نور بالای خورشید -->
    <line x1="40" y1="12" x2="40" y2="18" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="20" x2="25" y2="25" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" />
    <line x1="60" y1="20" x2="55" y2="25" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
